<div class="crypto-card" *ngFor="let productFromCart of cart">
  <div style="margin-bottom: -350px;" class="hero bg-base-200 min-h-screen">
  <div class="card bg-base-100 w-96 shadow-xl">
    <div class="card-body">
    <button (click)="deleteFromCart(productFromCart)" class="btn btn-primary">Delete from cart
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
      </svg>
    </button>
    </div>
    <a [routerLink]="['/detail', productFromCart.name]">
    <figure>
      <img [src]="productFromCart.imageUrl" alt="{{productFromCart.name}}"
      />
    </figure>
    <div class="card-body">
      <h2 class="card-title">{{productFromCart.name}}</h2>
<!--      <p>{{productFromCart.description}}</p>-->
      <p>USD {{productFromCart.price}}</p>
      <p>Amount: {{productFromCart.amount}}</p>
      <div class="card-actions justify-end">
      </div>
    </div></a>
  </div>
    <br><br>
  </div>
</div>

<div style="margin-bottom: -150px; margin-top: -900px;" class="hero bg-base-200 min-h-screen">
  <div class="card bg-base-100 w-96 shadow-xl">
    <div class="card-body">
    <h1 class="text-3xl font-bold">Total USD: {{getTotalPrice()}}</h1><br><br>
    <button class="btn btn-active btn-neutral">Checkout</button>
    </div>
  </div>
</div>
